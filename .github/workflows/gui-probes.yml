# Settles, on GitHub's standard hosted runners, whether GUI test jobs run on them:
# a WinUI 3 window driven through UI Automation on Windows, an accelerated Android
# emulator, and a JavaFX window on macOS. Dispatched by hand; nothing here holds
# or reads a credential.
name: gui-probes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-uia:
    name: windows / ${{ matrix.runner }} / ${{ matrix.runtime }} / uia
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            runtime: x64
          - runner: windows-11-arm
            runtime: arm64
          # The x64 build under Windows 11's x64 emulation: the x64 control on an OS the Windows App SDK lists.
          - runner: windows-11-arm
            runtime: x64
    runs-on: ${{ matrix.runner }}
    # The steps' bounds below total 30 minutes; checkout and the SDK's setup take the rest.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.403"
      # pamba's own step: the runtime of the pinned Windows App SDK's channel, confirmed a PE
      # because an unknown channel redirects to a search page that still returns 200.
      - name: Install the Windows App SDK runtime
        shell: pwsh
        timeout-minutes: 5
        run: |
          'stage: runtime'
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath 'probes/winui/S12WinUI.csproj'
          $pinned = $project.Project.ItemGroup.PackageReference | Where-Object { $_.Include -eq 'Microsoft.WindowsAppSDK' }
          if (-not $pinned) { throw 'Microsoft.WindowsAppSDK is not pinned in probes/winui/S12WinUI.csproj' }
          $channel = ($pinned.Version -split '\.')[0, 1] -join '.'
          $uri = "https://aka.ms/windowsappsdk/$channel/latest/windowsappruntimeinstall-${{ matrix.runtime }}.exe"
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall.exe'
          Invoke-WebRequest -Uri $uri -OutFile $installer -TimeoutSec 120
          $header = [System.IO.File]::ReadAllBytes($installer) | Select-Object -First 2
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) { throw "No Windows App SDK $channel runtime installer at $uri" }
          & $installer --quiet --force
          if ($LASTEXITCODE -ne 0) { throw "Windows App SDK runtime install failed: $LASTEXITCODE" }
          "Windows App SDK $channel runtime installed from $uri"
      - name: Build the WinUI 3 window
        shell: pwsh
        timeout-minutes: 10
        run: |
          'stage: build'
          dotnet build probes/winui/S12WinUI.csproj --configuration Release --runtime win-${{ matrix.runtime }} --self-contained true --output build/winui
      # Inner bounds: 3 package downloads x 120 s + the window 60 s + 6 waits x 30 s + the closing loop 30 s
      # + the privacy window's buttons 60 s = 690 s. 15 minutes exceed them, so the driver reports a failure
      # before GitHub cancels the step.
      - name: A WinUI 3 window on the job's desktop takes UI Automation and keys
        shell: powershell
        timeout-minutes: 15
        run: ./probes/windows-uia.ps1 -Application build/winui/S12WinUI.exe

  android-emulator:
    name: linux / ubuntu-24.04 / android-emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: An accelerated emulator boots and is read through UI Automator
        run: bash probes/android-emulator.sh

  macos-javafx:
    name: macos / ${{ matrix.runner }} / javafx
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: TestFX drives a JavaFX window
        run: bash probes/macos-javafx.sh
